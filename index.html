<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>日本語 بالعربي</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  :root {
    --bg: #0a0a1a;
    --bg2: #1a0a2e;
    --pink: #ff6b9d;
    --purple: #c44dff;
    --cyan: #4dc8ff;
    --green: #2A9D8F;
    --red: #E63946;
    --orange: #F4A261;
    --card: rgba(255,255,255,0.06);
    --border: rgba(255,255,255,0.12);
  }

  body {
    background: linear-gradient(135deg, var(--bg) 0%, var(--bg2) 50%, #0a1a0a 100%);
    font-family: 'Cairo', sans-serif;
    color: #fff;
    min-height: 100vh;
    overflow-x: hidden;
    padding-bottom: 80px;
  }

  /* HEADER */
  .header {
    background: rgba(10,10,26,0.9);
    backdrop-filter: blur(20px);
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 100;
  }
  .logo {
    font-size: 18px; font-weight: 800;
    background: linear-gradient(90deg, var(--pink), var(--purple), var(--cyan));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .badges { display:flex; gap:8px; }
  .badge {
    background: rgba(255,107,107,0.2);
    border: 1px solid rgba(255,107,107,0.4);
    border-radius: 20px; padding: 3px 10px; font-size: 12px;
    display:flex; align-items:center; gap:3px;
  }
  .badge.xp { background:rgba(77,200,255,0.2); border-color:rgba(77,200,255,0.4); }

  /* NAV BAR */
  .navbar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: rgba(10,10,26,0.97);
    backdrop-filter: blur(20px);
    border-top: 1px solid var(--border);
    display: flex; z-index: 100;
  }
  .nav-item {
    flex: 1; display:flex; flex-direction:column; align-items:center;
    padding: 10px 0 16px; cursor:pointer; opacity:0.4; transition:opacity 0.2s;
  }
  .nav-item.active { opacity:1; }
  .nav-icon { font-size:22px; }
  .nav-label { font-size:10px; font-weight:700; margin-top:2px; }

  /* SCREENS */
  .screen { display:none; padding: 16px; }
  .screen.active { display:block; }

  /* HOME */
  .hero-card {
    background: linear-gradient(135deg, rgba(196,77,255,0.25), rgba(77,200,255,0.15));
    border: 1px solid rgba(196,77,255,0.35);
    border-radius: 20px; padding: 24px 16px;
    text-align:center; margin-bottom:18px;
  }
  .hero-emoji { font-size:52px; }
  .hero-title { font-size:21px; font-weight:800; margin:8px 0 6px; }
  .hero-sub { font-size:13px; opacity:0.7; line-height:1.6; }

  .ai-btn {
    background: linear-gradient(135deg, var(--pink), var(--purple));
    border-radius: 16px; padding:16px; display:flex; align-items:center;
    gap:12px; cursor:pointer; margin-bottom:18px;
    border:none; color:#fff; width:100%; text-align:right;
    font-family:'Cairo',sans-serif;
  }
  .ai-btn-icon { font-size:28px; }
  .ai-btn-title { font-size:15px; font-weight:700; }
  .ai-btn-sub { font-size:12px; opacity:0.8; }

  .section-title { font-size:15px; font-weight:700; margin-bottom:12px; }

  .lessons-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:18px; }
  .lesson-card {
    border-radius:16px; padding:16px 14px; cursor:pointer;
    transition:transform 0.15s; border:1px solid;
  }
  .lesson-card:active { transform:scale(0.97); }
  .lesson-icon { font-size:30px; margin-bottom:6px; }
  .lesson-title { font-size:14px; font-weight:700; }
  .lesson-desc { font-size:11px; opacity:0.6; margin-top:2px; }
  .lesson-count { font-size:11px; opacity:0.4; margin-top:5px; }

  .tip-card {
    background: var(--card); border:1px solid var(--border);
    border-radius:16px; padding:14px; font-size:13px; line-height:1.8;
  }

  /* CHAT */
  #screen-chat { padding:0; display:flex; flex-direction:column; height:calc(100vh - 130px); }
  #screen-chat.active { display:flex; }
  .msg-list {
    flex:1; overflow-y:auto; padding:14px;
    display:flex; flex-direction:column; gap:10px;
  }
  .msg {
    max-width:84%; padding:10px 14px; border-radius:16px;
    font-size:14px; line-height:1.65; white-space:pre-wrap;
    border:1px solid;
  }
  .msg.user {
    align-self:flex-start;
    background: linear-gradient(135deg,rgba(196,77,255,0.25),rgba(77,200,255,0.15));
    border-color:rgba(196,77,255,0.4);
    border-radius:16px 16px 16px 4px;
  }
  .msg.bot {
    align-self:flex-end;
    background:rgba(255,255,255,0.08);
    border-color:rgba(255,255,255,0.15);
    border-radius:16px 16px 4px 16px;
  }
  .input-row {
    display:flex; gap:8px; padding:10px 14px 24px;
    border-top:1px solid var(--border);
    background: rgba(10,10,26,0.9);
  }
  #chat-input {
    flex:1; background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.2); border-radius:12px;
    padding:10px 14px; color:#fff; font-size:14px;
    font-family:'Cairo',sans-serif; outline:none;
  }
  #chat-input::placeholder { opacity:0.4; }
  .send-btn {
    background: linear-gradient(135deg, var(--purple), var(--cyan));
    border:none; border-radius:12px; width:44px; height:44px;
    cursor:pointer; font-size:18px; color:#fff;
    display:flex; align-items:center; justify-content:center;
  }

  /* FLASHCARD */
  .flash-header { text-align:center; margin-bottom:14px; }
  .flash-lesson-title { font-size:16px; font-weight:700; margin-bottom:10px; }
  .progress-bar {
    background:rgba(255,255,255,0.1); border-radius:8px; height:7px; margin-bottom:8px;
  }
  .progress-fill { height:100%; border-radius:8px; transition:width 0.3s; }
  .progress-text { font-size:12px; opacity:0.5; text-align:center; margin-bottom:16px; }

  .card-scene { width:100%; height:200px; perspective:1000px; cursor:pointer; margin-bottom:20px; }
  .card-inner {
    width:100%; height:100%; position:relative;
    transform-style:preserve-3d; transition:transform 0.5s;
  }
  .card-inner.flipped { transform:rotateY(180deg); }
  .card-face {
    position:absolute; width:100%; height:100%;
    backface-visibility:hidden; border-radius:20px;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:8px;
  }
  .card-front {
    background:linear-gradient(135deg,rgba(230,57,70,0.25),rgba(230,57,70,0.15));
    border:1px solid rgba(230,57,70,0.45);
  }
  .card-back {
    background:linear-gradient(135deg,rgba(42,157,143,0.25),rgba(42,157,143,0.15));
    border:1px solid rgba(42,157,143,0.45);
    transform:rotateY(180deg);
  }
  .card-jp { font-size:60px; line-height:1; }
  .card-romaji { font-size:16px; opacity:0.65; }
  .card-ar { font-size:26px; font-weight:800; }
  .card-hint { font-size:11px; opacity:0.35; margin-top:6px; }

  .flash-btns { display:flex; gap:10px; justify-content:center; }
  .flash-btn {
    border:none; border-radius:12px; padding:11px 22px;
    color:#fff; font-size:14px; font-weight:700;
    cursor:pointer; font-family:'Cairo',sans-serif;
    transition:transform 0.1s;
  }
  .flash-btn:active { transform:scale(0.96); }
  .flash-btn.prev { background:rgba(255,255,255,0.15); }

  /* PROGRESS SCREEN */
  .stats-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:18px; }
  .stat-card {
    background:var(--card); border:1px solid var(--border);
    border-radius:16px; padding:16px; text-align:center;
  }
  .stat-num { font-size:32px; font-weight:800; }
  .stat-label { font-size:12px; opacity:0.6; margin-top:4px; }
  .lesson-progress { margin-bottom:12px; }
  .lp-row { display:flex; justify-content:space-between; margin-bottom:6px; font-size:13px; }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <span class="logo">🌸 اليابانية بالعربي</span>
  <div class="badges">
    <div class="badge" id="streak-badge">🔥 <span id="streak-val">0</span></div>
    <div class="badge xp" id="xp-badge">⚡ <span id="xp-val">0</span></div>
  </div>
</div>

<!-- SCREENS -->

<!-- HOME -->
<div class="screen active" id="screen-home">
  <div class="hero-card">
    <div class="hero-emoji">🗾</div>
    <div class="hero-title">تعلم اليابانية بسهولة!</div>
    <div class="hero-sub">دروس تفاعلية + مساعد ذكاء اصطناعي<br>يشرح بالعربي الفصيح</div>
  </div>

  <button class="ai-btn" onclick="gotoChat()">
    <span class="ai-btn-icon">🤖</span>
    <div>
      <div class="ai-btn-title">اسأل المساعد الذكي</div>
      <div class="ai-btn-sub">اسأل عن أي كلمة أو جملة يابانية</div>
    </div>
  </button>

  <div class="section-title">📚 الدروس التفاعلية</div>
  <div class="lessons-grid" id="lessons-grid"></div>

  <div class="section-title">💡 نصيحة اليوم</div>
  <div class="tip-card" id="daily-tip"></div>
</div>

<!-- CHAT -->
<div class="screen" id="screen-chat">
  <div class="msg-list" id="msg-list"></div>
  <div class="input-row">
    <input id="chat-input" placeholder="اسأل عن أي كلمة يابانية..." onkeydown="if(event.key==='Enter')sendMsg()">
    <button class="send-btn" onclick="sendMsg()">➤</button>
  </div>
</div>

<!-- FLASHCARD -->
<div class="screen" id="screen-flash">
  <div class="flash-header">
    <div class="flash-lesson-title" id="flash-title"></div>
    <div class="progress-bar"><div class="progress-fill" id="flash-progress"></div></div>
    <div class="progress-text" id="flash-count"></div>
  </div>
  <div class="card-scene" onclick="flipCard()">
    <div class="card-inner" id="card-inner">
      <div class="card-face card-front">
        <div class="card-jp" id="card-jp"></div>
        <div class="card-romaji" id="card-romaji"></div>
        <div class="card-hint">اضغط لتقلب البطاقة 👆</div>
      </div>
      <div class="card-face card-back">
        <div class="card-ar" id="card-ar"></div>
        <div class="card-jp" id="card-jp2"></div>
        <div class="card-romaji" id="card-romaji2"></div>
      </div>
    </div>
  </div>
  <div class="flash-btns">
    <button class="flash-btn prev" onclick="prevCard()">◀ السابق</button>
    <button class="flash-btn" id="next-btn" onclick="nextCard()" style="background:var(--red)">التالي ▶</button>
  </div>
</div>

<!-- PROGRESS -->
<div class="screen" id="screen-progress">
  <div class="section-title" style="margin-top:4px">📊 تقدمك</div>
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-num" id="stat-xp" style="color:var(--cyan)">0</div>
      <div class="stat-label">نقاط XP</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="stat-streak" style="color:var(--orange)">0</div>
      <div class="stat-label">أيام متتالية 🔥</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="stat-cards" style="color:var(--green)">0</div>
      <div class="stat-label">بطاقات تعلمتها</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="stat-msgs" style="color:var(--pink)">0</div>
      <div class="stat-label">أسئلة للـ AI</div>
    </div>
  </div>
  <div class="section-title">تقدم الدروس</div>
  <div id="lesson-progress-list"></div>
</div>

<!-- NAV BAR -->
<div class="navbar">
  <div class="nav-item active" id="nav-home" onclick="showScreen('home')">
    <div class="nav-icon">🏠</div>
    <div class="nav-label">الرئيسية</div>
  </div>
  <div class="nav-item" id="nav-chat" onclick="showScreen('chat')">
    <div class="nav-icon">🤖</div>
    <div class="nav-label">المساعد</div>
  </div>
  <div class="nav-item" id="nav-flash" onclick="showScreen('flash')">
    <div class="nav-icon">🃏</div>
    <div class="nav-label">البطاقات</div>
  </div>
  <div class="nav-item" id="nav-progress" onclick="showScreen('progress')">
    <div class="nav-icon">📊</div>
    <div class="nav-label">تقدمي</div>
  </div>
</div>

<script>
// ── DATA ──
const LESSONS = [
  {
    id:"hiragana", title:"الهيراغانا", icon:"あ", color:"#E63946",
    desc:"الحروف الأساسية",
    cards:[
      {jp:"あ",romaji:"a",ar:"أ"},{jp:"い",romaji:"i",ar:"إي"},
      {jp:"う",romaji:"u",ar:"أو"},{jp:"え",romaji:"e",ar:"إي (e)"},
      {jp:"お",romaji:"o",ar:"أو (o)"},{jp:"か",romaji:"ka",ar:"كا"},
      {jp:"き",romaji:"ki",ar:"كي"},{jp:"く",romaji:"ku",ar:"كو"},
      {jp:"さ",romaji:"sa",ar:"سا"},{jp:"し",romaji:"shi",ar:"شي"},
      {jp:"な",romaji:"na",ar:"نا"},{jp:"に",romaji:"ni",ar:"ني"},
      {jp:"は",romaji:"ha",ar:"ها"},{jp:"ま",romaji:"ma",ar:"ما"},
      {jp:"や",romaji:"ya",ar:"يا"},{jp:"ら",romaji:"ra",ar:"را"},
    ]
  },
  {
    id:"katakana", title:"الكاتاكانا", icon:"ア", color:"#c44dff",
    desc:"حروف الكلمات الأجنبية",
    cards:[
      {jp:"ア",romaji:"a",ar:"أ"},{jp:"イ",romaji:"i",ar:"إي"},
      {jp:"ウ",romaji:"u",ar:"أو"},{jp:"エ",romaji:"e",ar:"إي (e)"},
      {jp:"オ",romaji:"o",ar:"أو (o)"},{jp:"カ",romaji:"ka",ar:"كا"},
      {jp:"キ",romaji:"ki",ar:"كي"},{jp:"ク",romaji:"ku",ar:"كو"},
      {jp:"テ",romaji:"te",ar:"تي"},{jp:"ト",romaji:"to",ar:"تو"},
    ]
  },
  {
    id:"numbers", title:"الأرقام", icon:"１", color:"#2A9D8F",
    desc:"من ١ إلى ١٠",
    cards:[
      {jp:"一",romaji:"ichi",ar:"واحد"},{jp:"二",romaji:"ni",ar:"اثنان"},
      {jp:"三",romaji:"san",ar:"ثلاثة"},{jp:"四",romaji:"yon",ar:"أربعة"},
      {jp:"五",romaji:"go",ar:"خمسة"},{jp:"六",romaji:"roku",ar:"ستة"},
      {jp:"七",romaji:"nana",ar:"سبعة"},{jp:"八",romaji:"hachi",ar:"ثمانية"},
      {jp:"九",romaji:"kyuu",ar:"تسعة"},{jp:"十",romaji:"juu",ar:"عشرة"},
    ]
  },
  {
    id:"greetings", title:"التحيات", icon:"👋", color:"#F4A261",
    desc:"جمل يومية أساسية",
    cards:[
      {jp:"おはようございます",romaji:"Ohayou gozaimasu",ar:"صباح الخير"},
      {jp:"こんにちは",romaji:"Konnichiwa",ar:"مرحباً"},
      {jp:"こんばんは",romaji:"Konbanwa",ar:"مساء الخير"},
      {jp:"ありがとう",romaji:"Arigatou",ar:"شكراً"},
      {jp:"すみません",romaji:"Sumimasen",ar:"عفواً / آسف"},
      {jp:"はい",romaji:"Hai",ar:"نعم"},
      {jp:"いいえ",romaji:"Iie",ar:"لا"},
      {jp:"さようなら",romaji:"Sayounara",ar:"وداعاً"},
      {jp:"どうぞ",romaji:"Douzo",ar:"تفضل"},
      {jp:"おやすみ",romaji:"Oyasumi",ar:"تصبح على خير"},
    ]
  },
  {
    id:"food", title:"الطعام", icon:"🍜", color:"#ff6b9d",
    desc:"أسماء الأطعمة",
    cards:[
      {jp:"すし",romaji:"Sushi",ar:"سوشي"},
      {jp:"ラーメン",romaji:"Raamen",ar:"رامن (شعرية)"},
      {jp:"てんぷら",romaji:"Tenpura",ar:"تمبورا"},
      {jp:"みず",romaji:"Mizu",ar:"ماء"},
      {jp:"ごはん",romaji:"Gohan",ar:"أرز / وجبة"},
      {jp:"おちゃ",romaji:"Ocha",ar:"شاي"},
      {jp:"さかな",romaji:"Sakana",ar:"سمك"},
      {jp:"にく",romaji:"Niku",ar:"لحم"},
    ]
  },
  {
    id:"colors", title:"الألوان", icon:"🎨", color:"#4dc8ff",
    desc:"أسماء الألوان",
    cards:[
      {jp:"あか",romaji:"Aka",ar:"أحمر"},
      {jp:"あお",romaji:"Ao",ar:"أزرق / أخضر"},
      {jp:"しろ",romaji:"Shiro",ar:"أبيض"},
      {jp:"くろ",romaji:"Kuro",ar:"أسود"},
      {jp:"き",romaji:"Ki",ar:"أصفر"},
      {jp:"みどり",romaji:"Midori",ar:"أخضر"},
      {jp:"ピンク",romaji:"Pinku",ar:"وردي"},
      {jp:"むらさき",romaji:"Murasaki",ar:"بنفسجي"},
    ]
  },
];

const TIPS = [
  "كلمة 「ありがとう」(أريغاتو) تعني شكراً. قولها مع انحناءة خفيفة دليل احترام! 🙏",
  "اليابانية فيها ٣ أبجديات: هيراغانا، كاتاكانا، وكانجي. ابدأ بالهيراغانا! 📝",
  "كلمة 「かわいい」(كاوايي) تعني 'لطيف/جميل' وهي من أشهر الكلمات اليابانية! 🌸",
  "الكاتاكانا تُستخدم لكتابة الكلمات الأجنبية زي アラビア (عربي)! 🌍",
  "في اليابان، تقول 「いただきます」(إيتاداكيماس) قبل الأكل = بسم الله! 🍱",
];

const SYSTEM = `أنت مدرس متخصص في تعليم اللغة اليابانية للناطقين بالعربية.
- اشرح دائماً بالعربية البسيطة والواضحة
- اكتب الكلمات اليابانية بالحروف اليابانية ثم بالنطق (romaji) ثم المعنى
- قدم أمثلة عملية وجمل قصيرة مفيدة
- كن مشجعاً وإيجابياً دائماً
- ردودك مختصرة ومفيدة (٣-٦ أسطر كافية)`;

// ── STATE ──
let state = JSON.parse(localStorage.getItem('nihongo_state') || '{}');
state.xp = state.xp || 0;
state.streak = state.streak || 1;
state.cardsLearned = state.cardsLearned || 0;
state.msgsCount = state.msgsCount || 0;
state.lessonProgress = state.lessonProgress || {};

let currentScreen = 'home';
let activeLesson = null;
let cardIndex = 0;
let cardFlipped = false;
let chatHistory = [
  {role:'assistant', content:'مرحباً! 🌸 أنا مساعدك لتعليم اللغة اليابانية.\nاسألني عن أي كلمة أو جملة وهشرحهالك بالعربي!\n\nمثلاً: «إيه معنى ありがとう؟» أو «عايز أتعلم أقول صباح الخير»'}
];

function saveState() { localStorage.setItem('nihongo_state', JSON.stringify(state)); }

// ── INIT ──
function init() {
  updateBadges();
  renderLessons();
  renderTip();
  renderChat();
  renderProgress();
}

function updateBadges() {
  document.getElementById('streak-val').textContent = state.streak;
  document.getElementById('xp-val').textContent = state.xp;
  document.getElementById('stat-xp').textContent = state.xp;
  document.getElementById('stat-streak').textContent = state.streak;
  document.getElementById('stat-cards').textContent = state.cardsLearned;
  document.getElementById('stat-msgs').textContent = state.msgsCount;
}

function renderTip() {
  const t = TIPS[Math.floor(Math.random() * TIPS.length)];
  document.getElementById('daily-tip').innerHTML = '🌸 ' + t;
}

function renderLessons() {
  const grid = document.getElementById('lessons-grid');
  grid.innerHTML = LESSONS.map(l => {
    const prog = state.lessonProgress[l.id] || 0;
    const pct = Math.round((prog / l.cards.length) * 100);
    return `<div class="lesson-card" style="background:linear-gradient(135deg,${l.color}22,${l.color}11);border-color:${l.color}44"
      onclick="startLesson('${l.id}')">
      <div class="lesson-icon">${l.icon}</div>
      <div class="lesson-title">${l.title}</div>
      <div class="lesson-desc">${l.desc}</div>
      <div style="margin-top:8px;background:rgba(255,255,255,0.1);border-radius:4px;height:4px">
        <div style="width:${pct}%;height:100%;background:${l.color};border-radius:4px"></div>
      </div>
      <div class="lesson-count">${l.cards.length} بطاقة • ${pct}%</div>
    </div>`;
  }).join('');
}

function renderProgress() {
  const list = document.getElementById('lesson-progress-list');
  list.innerHTML = LESSONS.map(l => {
    const prog = state.lessonProgress[l.id] || 0;
    const pct = Math.round((prog / l.cards.length) * 100);
    return `<div class="lesson-progress">
      <div class="lp-row"><span>${l.icon} ${l.title}</span><span style="opacity:0.6">${prog}/${l.cards.length}</span></div>
      <div class="progress-bar">
        <div class="progress-fill" style="width:${pct}%;background:${l.color}"></div>
      </div>
    </div>`;
  }).join('');
}

// ── SCREEN NAV ──
function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  const s = document.getElementById('screen-' + name);
  const n = document.getElementById('nav-' + name);
  if (s) s.classList.add('active');
  if (n) n.classList.add('active');
  currentScreen = name;
  if (name === 'progress') { updateBadges(); renderProgress(); }
}

function gotoChat() { showScreen('chat'); }

// ── LESSONS ──
function startLesson(id) {
  activeLesson = LESSONS.find(l => l.id === id);
  cardIndex = 0; cardFlipped = false;
  renderCard();
  showScreen('flash');
  document.getElementById('nav-flash').classList.add('active');
  document.getElementById('nav-home').classList.remove('active');
}

function renderCard() {
  if (!activeLesson) return;
  const card = activeLesson.cards[cardIndex];
  const total = activeLesson.cards.length;
  document.getElementById('flash-title').textContent = activeLesson.icon + ' ' + activeLesson.title;
  document.getElementById('flash-progress').style.width = ((cardIndex+1)/total*100) + '%';
  document.getElementById('flash-progress').style.background = activeLesson.color;
  document.getElementById('flash-count').textContent = (cardIndex+1) + ' / ' + total;
  document.getElementById('card-jp').textContent = card.jp;
  document.getElementById('card-jp2').textContent = card.jp;
  document.getElementById('card-romaji').textContent = card.romaji;
  document.getElementById('card-romaji2').textContent = card.romaji;
  document.getElementById('card-ar').textContent = card.ar;
  document.getElementById('card-inner').classList.remove('flipped');
  cardFlipped = false;
  const isLast = cardIndex === total - 1;
  const nextBtn = document.getElementById('next-btn');
  nextBtn.textContent = isLast ? '✅ أنهيت الدرس!' : 'التالي ▶';
  nextBtn.style.background = isLast ? 'var(--green)' : activeLesson.color;
}

function flipCard() {
  cardFlipped = !cardFlipped;
  document.getElementById('card-inner').classList.toggle('flipped', cardFlipped);
}

function nextCard() {
  const total = activeLesson.cards.length;
  state.xp += 2; state.cardsLearned++;
  if (!state.lessonProgress[activeLesson.id] || state.lessonProgress[activeLesson.id] < cardIndex + 1) {
    state.lessonProgress[activeLesson.id] = cardIndex + 1;
  }
  saveState(); updateBadges();
  if (cardIndex < total - 1) {
    cardIndex++; renderCard();
  } else {
    state.xp += 20; saveState(); updateBadges(); renderLessons();
    alert('🎉 أحسنت! أنهيت درس ' + activeLesson.title + '!\nحصلت على +20 XP');
    showScreen('home');
  }
}

function prevCard() {
  if (cardIndex > 0) { cardIndex--; renderCard(); }
}

// ── CHAT ──
function renderChat() {
  const list = document.getElementById('msg-list');
  list.innerHTML = chatHistory.map(m =>
    `<div class="msg ${m.role === 'user' ? 'user' : 'bot'}">${m.role==='assistant'?'🌸 ':''}${escHtml(m.content)}</div>`
  ).join('');
  list.scrollTop = list.scrollHeight;
}

function escHtml(t) {
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function sendMsg() {
  const inp = document.getElementById('chat-input');
  const text = inp.value.trim();
  if (!text) return;
  chatHistory.push({role:'user', content:text});
  inp.value = '';
  renderChat();
  state.msgsCount++; saveState(); updateBadges();

  // loading
  chatHistory.push({role:'assistant', content:'⏳ جاري التفكير...'});
  renderChat();

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:1000,
        system:SYSTEM,
        messages: chatHistory.slice(0,-1).map(m=>({role:m.role,content:m.content}))
      })
    });
    const data = await res.json();
    const reply = data.content?.[0]?.text || 'حدث خطأ، حاول مرة أخرى!';
    chatHistory[chatHistory.length-1] = {role:'assistant', content:reply};
    state.xp += 5; saveState(); updateBadges();
  } catch(e) {
    chatHistory[chatHistory.length-1] = {role:'assistant', content:'❌ في مشكلة في الاتصال، تأكد من الإنترنت وحاول تاني.'};
  }
  renderChat();
}

init();
</script>
