      const toggleFlip = (key) => setFlipped(prev=>({...prev,[key]:!prev[key]}));

        const text = aiInput.trim();
        if (!text || aiLoading) return;
        const userMsg = {role:"user", text};
        setAiMessages(prev=>[...prev, userMsg]);
        setAiInput("");

            role: m.role==="assistant"?"model":"user",

            headers:{"Content-Type":"application/json"},

          });
          const data = await res.json();
          const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "عذراً، حدث خطأ.";
          setAiMessages(prev=>[...prev,{role:"assistant",text:reply}]);

          setAiMessages(prev=>[...prev,{role:"assistant",text:"خطأ: " + err.message}]);

            {/* Header */}
            <div style={{textAlign:"center",padding:"36px 20px 28px",position:"relative",marginBottom:8}}>
              <div style={{position:"absolute",top:"50%",left:"50%",transform:"translate(-50%,-50%)",width:320,height:320,
                background:"radial-gradient(circle,rgba(220,38,38,0.08) 0%,transparent 70%)",borderRadius:"50%",pointerEvents:"none"}}/>
              <div style={{display:"flex",justifyContent:"center",alignItems:"center",gap:12,marginBottom:12}}>
                <span style={{fontSize:36}}>🇯🇵</span>
                <span style={{color:"#DC2626",fontSize:22,fontWeight:"bold"}}>⟷</span>
                <span style={{fontSize:36}}>🇪🇬</span>
              </div>
              <h1 className="shimmer-text" style={{fontSize:36,fontWeight:900,marginBottom:8,fontFamily:"'Noto Sans JP','Tajawal',sans-serif"}}>
                にほんご مع العربي
              </h1>
              <p style={{color:"#6b3a5a",fontSize:16,fontWeight:600}}>تعلّم اليابانية بسهولة وبالعربي الفصيح 🌸</p>
            </div>

            {/* Lesson List */}
            {!activeLesson && (
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14,marginTop:8}}>
                {lessons.map((l,i)=>(
                  <button key={l.id} className="lesson-btn" onClick={()=>setActiveLesson(l.id)}
                    style={{border:"none",borderRadius:18,padding:"20px 16px",display:"flex",flexDirection:"column",
                      alignItems:"center",gap:8,color:"#fff",textShadow:"0 1px 4px rgba(0,0,0,0.2)",
                      boxShadow:"0 4px 18px rgba(0,0,0,0.10)",
                      background:`linear-gradient(135deg,${l.color}dd,${l.color}88)`,
                      animation:`fadeUp 0.5s ${i*0.08}s ease forwards`,opacity:0}}>
                    <span style={{fontSize:36}}>{l.icon}</span>
                    <span style={{fontSize:15,fontWeight:700,textAlign:"center"}}>{l.title}</span>
                    <span style={{fontSize:18,opacity:0.85}}>←</span>
                  </button>
                ))}
                <button className="lesson-btn" onClick={()=>setShowAI(true)}
                  style={{border:"none",borderRadius:18,padding:"20px 16px",display:"flex",flexDirection:"row",
                    justifyContent:"center",alignItems:"center",gap:12,color:"#fff",
                    background:"linear-gradient(135deg,#7C3AED,#A855F7)",
                    gridColumn:"1 / -1",boxShadow:"0 6px 24px rgba(124,58,237,0.3)",
                    animation:`fadeUp 0.5s ${lessons.length*0.08}s ease forwards`,opacity:0}}>
                  <span style={{fontSize:28}}>🤖</span>
                  <div style={{textAlign:"right"}}>
                    <div style={{fontSize:16,fontWeight:900}}>المساعد الذكي</div>
                    <div style={{fontSize:12,opacity:0.85}}>اسألني أي سؤال عن اليابانية</div>
                  </div>
                  <span style={{fontSize:22}}>✨</span>
                </button>
              </div>
            )}

            {/* Lesson Detail */}
            {lesson && (
              <div style={{animation:"fadeUp 0.4s ease"}}>
                <button onClick={()=>{setActiveLesson(null);setFlipped({});}}
                  style={{background:"#fff",border:"2px solid #DC2626",color:"#DC2626",borderRadius:12,
                    padding:"10px 20px",cursor:"pointer",fontSize:15,marginBottom:16,
                    fontFamily:"'Tajawal',sans-serif",fontWeight:700,boxShadow:"0 2px 8px rgba(220,38,38,0.10)"}}>
                  ← العودة للقائمة
                </button>

                <div style={{borderRadius:18,padding:"20px",display:"flex",alignItems:"center",gap:16,marginBottom:20,
                  color:"#fff",boxShadow:"0 6px 24px rgba(0,0,0,0.12)",
                  background:`linear-gradient(135deg,${lesson.color},${lesson.color}88)`}}>
                  <span style={{fontSize:40}}>{lesson.icon}</span>
                  <h2 style={{fontSize:22,fontWeight:900,color:"#fff",textShadow:"0 2px 8px rgba(0,0,0,0.2)"}}>{lesson.title}</h2>
                </div>

                {lesson.isIntro && (
                  <div style={{background:"#fff",borderRadius:18,padding:"24px 20px",border:"2px solid #ffd6e0",
                    marginBottom:20,boxShadow:"0 4px 20px rgba(220,38,38,0.07)"}}>
                    {lesson.content.trim().split("\n\n").map((para,i)=>(
                      <p key={i} style={{color:"#3d1f2f",fontSize:15,lineHeight:2,marginBottom:16,whiteSpace:"pre-line"}}>{para.trim()}</p>
                    ))}
                  </div>
                )}

                {lesson.items && (
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:16}}>
                    {lesson.items.map((item,i)=>{
                      const key=`${lesson.id}-${i}`;
                      return <FlipCard key={key} item={item} cardKey={key} color={lesson.color} flipped={flipped} toggleFlip={toggleFlip}/>;
                    })}
                  </div>
                )}

                {lesson.groups && lesson.groups.map((group,gi)=>(
                  <div key={gi} style={{marginBottom:24}}>
                    <div style={{fontSize:13,fontWeight:700,borderRight:`4px solid ${lesson.color}88`,
                      paddingRight:10,marginBottom:10,textAlign:"right",color:lesson.color}}>
                      {group.label}
                    </div>
                    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:16}}>
                      {group.items.map((item,i)=>{
                        const key=`${lesson.id}-g${gi}-${i}`;
                        return <FlipCard key={key} item={item} cardKey={key} color={lesson.color} flipped={flipped} toggleFlip={toggleFlip}/>;
                      })}
                    </div>
                  </div>
                ))}

                <p style={{textAlign:"center",color:"#a0607a",fontSize:13,marginTop:8,marginBottom:20}}>
                  💡 اضغط على أي بطاقة لتقلبها وترى المعنى بالعربي
                </p>
              </div>
            )}

            <div style={{textAlign:"center",color:"#c09aaa",fontSize:12,marginTop:32}}>
              🌸 にほんごアラビア語 • تعلم اليابانية بالعربي 🌸
            </div>
          </div>

          {/* AI Modal */}
          {showAI && (
            <div onClick={e=>e.target===e.currentTarget&&setShowAI(false)}
              style={{position:"fixed",inset:0,background:"rgba(30,10,50,0.45)",backdropFilter:"blur(4px)",
                zIndex:100,display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
              <div style={{background:"linear-gradient(160deg,#fdf8ff,#fff0f8)",borderRadius:"24px 24px 0 0",
                width:"100%",maxWidth:700,height:"80vh",display:"flex",flexDirection:"column",
                boxShadow:"0 -8px 40px rgba(124,58,237,0.18)",border:"2px solid #e8d0f8",borderBottom:"none",overflow:"hidden"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"16px 20px",
                  background:"linear-gradient(135deg,#7C3AED,#A855F7)",color:"#fff",fontWeight:900,fontSize:17,direction:"rtl"}}>
                  <span>🤖 المساعد الذكي</span>
                  <button onClick={()=>setShowAI(false)}
                    style={{background:"rgba(255,255,255,0.2)",border:"none",color:"#fff",borderRadius:8,width:32,height:32,cursor:"pointer",fontSize:16,fontWeight:700}}>✕</button>
                </div>
                <div style={{flex:1,overflowY:"auto",padding:"16px 14px",display:"flex",flexDirection:"column"}}>
                  {aiMessages.map((m,i)=>(
                    <div key={i} style={{display:"flex",justifyContent:m.role==="user"?"flex-start":"flex-end",marginBottom:10}}>
                      <div style={{maxWidth:"82%",padding:"10px 14px",
                        borderRadius:m.role==="user"?"18px 18px 18px 4px":"18px 18px 4px 18px",
                        background:m.role==="user"?"linear-gradient(135deg,#7C3AED,#A855F7)":"#fff",
                        color:m.role==="user"?"#fff":"#2d1a3d",fontSize:14,lineHeight:1.7,
                        boxShadow:"0 2px 8px rgba(0,0,0,0.10)",
                        border:m.role==="assistant"?"1px solid #e8d5f0":"none",
                        whiteSpace:"pre-wrap",textAlign:"right",direction:"rtl",fontFamily:"'Tajawal',sans-serif"}}>
                        {m.text}
                      </div>
                    </div>
                  ))}
                  {aiLoading && (
                    <div style={{display:"flex",justifyContent:"flex-end",marginBottom:10}}>
                      <div style={{background:"#fff",border:"1px solid #e8d5f0",borderRadius:"18px 18px 4px 18px",
                        padding:"10px 18px",fontSize:20,boxShadow:"0 2px 8px rgba(0,0,0,0.08)"}}>💬</div>
                    </div>
                  )}
                </div>
                <div style={{display:"flex",gap:8,padding:"12px 14px 16px",borderTop:"1px solid #f0d8f8",background:"#fff",direction:"rtl"}}>
                  <button onClick={sendAIMessage} disabled={aiLoading||!aiInput.trim()}
                    style={{background:"linear-gradient(135deg,#7C3AED,#A855F7)",border:"none",borderRadius:12,
                      color:"#fff",padding:"10px 18px",fontWeight:700,fontSize:14,cursor:"pointer",
                      fontFamily:"'Tajawal',sans-serif",whiteSpace:"nowrap",
                      opacity:aiLoading||!aiInput.trim()?0.5:1}}>إرسال</button>
                  <input value={aiInput} onChange={e=>setAiInput(e.target.value)}
                    onKeyDown={e=>e.key==="Enter"&&sendAIMessage()}
                    placeholder="اكتب سؤالك عن اليابانية..."
                    dir="rtl"
                    style={{flex:1,border:"2px solid #d8b8f0",borderRadius:12,padding:"10px 14px",
                      fontSize:14,fontFamily:"'Tajawal',sans-serif",outline:"none",
                      background:"#fdf8ff",color:"#2d1a3d",direction:"rtl"}}/>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
