<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مانجا بالياباني</title>
<style>
:root{--paper:#f6f1e8;--ink:#17131a;--pink:#e91e8c;--pink-soft:#fde3f0;--mute:#6f646b;--card:#fffdf8;--line:#e3d9cc;--ok:#1f9d6b;--bad:#d6403a}
@media (prefers-color-scheme:dark){:root{--paper:#1b1619;--card:#261f23;--line:#3a2f33;--mute:#aa99a2;--pink:#ff4fa8;--pink-soft:#4a2036}
  body{color:#f4ebe6}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:'Noto Sans Arabic','Segoe UI',Tahoma,sans-serif;line-height:1.6;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:560px;margin:0 auto;padding:14px 12px 110px}
.jp{font-family:'Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
h1{font-size:1.2rem;margin:0}
.back{background:none;border:0;font-size:1.4rem;padding:4px 8px;color:var(--mute)}
.pts{background:var(--pink-soft);color:var(--pink);border-radius:99px;padding:4px 12px;font-size:.85rem;font-weight:700}
.hidden{display:none}

/* story list */
.cover{display:flex;gap:14px;align-items:center;width:100%;text-align:right;background:var(--card);
  border:3px solid var(--ink);border-radius:6px;padding:12px;box-shadow:5px 5px 0 var(--ink);margin-bottom:16px}
.cover .art{font-size:2.6rem;width:76px;height:76px;display:grid;place-items:center;border:2px solid var(--ink);
  background:#ffd9ec;background-image:radial-gradient(#e91e8c55 1.2px,transparent 1.4px);background-size:7px 7px;border-radius:4px}
.cover b{display:block;font-size:1.1rem}.cover small{color:var(--mute)}
.cover .tick{margin-inline-start:auto;color:var(--ok);font-weight:800;font-size:1.3rem}

/* reader */
.tools{display:flex;gap:8px;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 14px;font-size:.85rem;color:inherit}
.chip[aria-pressed="true"]{background:var(--pink);border-color:var(--pink);color:#fff}
.hint{font-size:.8rem;color:var(--mute);margin:0 0 10px}
.page{display:grid;grid-template-columns:1fr 1fr;gap:8px;direction:rtl}
.panel{border:3px solid #17131a;background:#fff;color:#17131a;position:relative;overflow:hidden;min-height:210px;
  display:flex;flex-direction:column;justify-content:space-between;padding:8px;gap:6px}
.panel.span2{grid-column:1/-1;min-height:230px}
.panel .bg{position:absolute;inset:0;z-index:0;background-image:radial-gradient(rgba(23,19,26,.16) 1.2px,transparent 1.5px);background-size:8px 8px}
.panel>*{position:relative;z-index:1}
.panel .art{font-size:3.4rem;text-align:center;line-height:1.1;filter:drop-shadow(2px 3px 0 rgba(23,19,26,.25))}
.panel .art img{max-width:100%;max-height:140px}
.span2 .art{font-size:4.2rem}

.bub{background:#fff;color:#17131a;border:2px solid #17131a;border-radius:18px;padding:6px 10px;max-width:92%;position:relative;margin-bottom:8px}
.bub.r{align-self:flex-end}.bub.l{align-self:flex-start}
.bub::after{content:"";position:absolute;bottom:-9px;width:12px;height:12px;background:#fff;
  border-right:2px solid #17131a;border-bottom:2px solid #17131a;transform:rotate(45deg)}
.bub.r::after{right:18px}.bub.l::after{left:18px}
.bub.nar{border-radius:2px;background:#fff6c9;align-self:stretch;max-width:100%}
.bub.nar::after{display:none}
.t{direction:ltr;text-align:left;font-size:1.2rem;line-height:2.1}
.sfx{align-self:center;font-weight:900;font-size:1.7rem;letter-spacing:2px;color:var(--pink);
  -webkit-text-stroke:1.5px #17131a;paint-order:stroke fill;transform:rotate(-6deg);direction:ltr}
.tr{display:none;margin-top:2px;padding-top:4px;border-top:1px dashed #bbb;color:#555;font-size:.82rem;direction:rtl}
body.showtr .tr{display:block}
.w{border-radius:5px;padding:0 1px;cursor:pointer}
.w.on{background:var(--pink-soft);color:#c4106f}
.w.p{cursor:default}
rt{font-size:.5em;color:#777}
body.nofuri rt{display:none}

/* sheet */
.sheet{position:fixed;inset:auto 0 0 0;background:var(--card);border-top:3px solid var(--ink);padding:14px 18px calc(16px + env(safe-area-inset-bottom,0));
  transform:translateY(110%);transition:transform .18s ease;max-width:560px;margin:0 auto;z-index:20}
.sheet.open{transform:none}
.sheet .big{font-size:2rem;direction:ltr;text-align:center}
.sheet .rd{color:var(--mute);text-align:center;direction:ltr}
.sheet .mn{font-size:1.2rem;font-weight:700;text-align:center;margin-top:4px}

/* quiz */
.quiz{margin-top:16px;background:var(--card);border:3px solid var(--ink);border-radius:6px;padding:12px;box-shadow:4px 4px 0 var(--ink)}
.quiz h2{font-size:1rem;margin:0 0 10px}
.opt{display:block;width:100%;text-align:right;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,transparent)}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,transparent)}
.msg{font-weight:700;margin-top:4px}
.next{margin-top:10px;width:100%;background:var(--pink);color:#fff;border:0;border-radius:10px;padding:12px;font-weight:700}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <button class="back" id="back" aria-label="رجوع">›</button>
    <h1 id="title">مانجا بالياباني</h1>
    <span class="pts" id="pts">0 نقطة</span>
  </header>

  <div id="listView"></div>

  <div id="readView" class="hidden">
    <div class="tools">
      <button class="chip" id="tFuri" aria-pressed="true">فوريجانا</button>
      <button class="chip" id="tTr" aria-pressed="false">الترجمة</button>
    </div>
    <p class="hint">اقرأ من اليمين لليسار زي المانجا الأصلية، واضغط على أي كلمة لمعناها.</p>
    <div class="page" id="page"></div>
    <div class="quiz" id="quiz"></div>
  </div>
</div>

<div class="sheet" id="sheet" role="dialog" aria-live="polite">
  <div class="big jp" id="sW"></div><div class="rd jp" id="sR"></div><div class="mn" id="sM"></div>
</div>

<script>
/* القصص بتتحمّل من manga-data.json (نفس فولدر الصفحة في Assets) */
let STORIES=[];
async function loadStories(){
  $("listView").innerHTML='<p class="hint">جاري تحميل القصص…</p>';
  try{
    const r=await fetch("manga-data.json"); if(!r.ok) throw new Error("http "+r.status);
    const d=await r.json(); STORIES=d.stories||d; renderList();
  }catch(err){
    $("listView").innerHTML='<p class="hint">تعذّر تحميل القصص. اتأكد إن manga-data.json جنب الصفحة.</p><button class="chip" id="retry">حاول تاني</button>';
    $("retry").onclick=loadStories;
  }
}

const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},
             set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const $=id=>document.getElementById(id);
let done=store.get("nihongo_manga_done",[]), cur=null;
const points=()=>Number(store.get("nihongo_points",0))||0;
const renderPts=()=>{$("pts").textContent=points()+" نقطة"};

function renderList(){
  $("listView").innerHTML=STORIES.map(s=>`<button class="cover" data-id="${s.id}">
    <span class="art">${s.icon}</span><span><b>${s.title}</b><small>${s.sub}</small></span>
    ${done.includes(s.id)?'<span class="tick">✓</span>':''}</button>`).join("");
  $("listView").querySelectorAll(".cover").forEach(b=>b.onclick=()=>openStory(b.dataset.id));
}

function wHTML(x){
  if(x.p) return `<span class="w p">${x.w}</span>`;
  const inner=x.r?`<ruby>${x.w}<rt>${x.r}</rt></ruby>`:x.w;
  return `<span class="w" data-w="${x.w}" data-r="${x.r||""}" data-m="${x.m}">${inner}</span>`;
}
function itemHTML(it){
  const words=it.words.map(wHTML).join("");
  if(it.k==="sfx") return `<div class="sfx jp">${words}</div>`;
  return `<div class="bub ${it.k==="nar"?"nar":it.side||"r"}"><div class="t jp">${words}</div><div class="tr">${it.tr||""}</div></div>`;
}
function openStory(id){
  cur=STORIES.find(s=>s.id===id);
  $("title").textContent=cur.title;
  $("listView").classList.add("hidden"); $("readView").classList.remove("hidden");
  $("page").innerHTML=cur.panels.map(p=>`<div class="panel${p.span===2?" span2":""}" style="background:${p.bg}">
    <div class="bg"></div>
    ${p.items.map(itemHTML).join("")}
    <div class="art">${p.img?`<img src="${p.img}" alt="">`:p.art}</div></div>`).join("");
  $("page").querySelectorAll(".w:not(.p)").forEach(w=>w.onclick=e=>{e.stopPropagation();showWord(w)});
  renderQuiz(); window.scrollTo(0,0);
}
function showWord(el){
  document.querySelectorAll(".w.on").forEach(x=>x.classList.remove("on"));
  el.classList.add("on");
  $("sW").textContent=el.dataset.w; $("sR").textContent=el.dataset.r; $("sM").textContent=el.dataset.m;
  $("sheet").classList.add("open");
}
function closeSheet(){$("sheet").classList.remove("open");document.querySelectorAll(".w.on").forEach(x=>x.classList.remove("on"))}
document.addEventListener("click",e=>{if(!e.target.closest(".w")&&!e.target.closest("#sheet"))closeSheet()});

function renderQuiz(){
  const q=cur.q,already=done.includes(cur.id);
  $("quiz").innerHTML=`<h2>${q.ask}</h2>`+q.opts.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join("")+`<div class="msg" id="msg"></div>`;
  $("quiz").querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.i,already));
}
function answer(i,already){
  const q=cur.q,opts=$("quiz").querySelectorAll(".opt");
  if(i===q.ans){
    opts[i].classList.add("ok"); opts.forEach(o=>o.disabled=true);
    if(!already){done.push(cur.id);store.set("nihongo_manga_done",done);store.set("nihongo_points",points()+3);renderPts();$("msg").textContent="صح! +٣ نقاط"}
    else $("msg").textContent="صح!";
    $("msg").style.color="var(--ok)";
    $("quiz").insertAdjacentHTML("beforeend",`<button class="next" id="next">رجوع للقصص</button>`);
    $("next").onclick=goList;
  }else{
    opts[i].classList.add("bad"); opts[i].disabled=true;
    $("msg").textContent="جرّب تاني، وراجع القصة"; $("msg").style.color="var(--bad)";
  }
}
function goList(){
  closeSheet(); cur=null; $("title").textContent="مانجا بالياباني";
  $("readView").classList.add("hidden"); $("listView").classList.remove("hidden"); renderList();
}
$("back").onclick=()=>cur?goList():(history.length>1?history.back():null);
$("tFuri").onclick=e=>{const on=e.currentTarget.getAttribute("aria-pressed")!=="true";e.currentTarget.setAttribute("aria-pressed",on);document.body.classList.toggle("nofuri",!on)};
$("tTr").onclick=e=>{const on=e.currentTarget.getAttribute("aria-pressed")!=="true";e.currentTarget.setAttribute("aria-pressed",on);document.body.classList.toggle("showtr",on)};
renderPts(); loadStories();
</script>
</body>
</html>
