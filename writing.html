<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>تدريب الكتابة – Nihongo Arabic</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;600;700&family=Noto+Sans+JP:wght@300;400;700&display=swap" rel="stylesheet">
<style>
:root {
--pink: #e91e8c;
--light-pink: #fce4f3;
--dark-pink: #c0166e;
--white: #ffffff;
--soft-gray: #f8f0f5;
--text: #2d1a26;
--card-bg: #ffffff;
--card-border: var(--light-pink);
--muted: #999999;
--card-shadow: 0 4px 20px rgba(233,30,140,0.08);
}
body.dark-mode {
--soft-gray: #150e18;
--text: #f0e6f5;
--card-bg: #201824;
--card-border: #3a2a44;
--light-pink: #2a1f30;
--muted: #a08aa8;
--card-shadow: 0 4px 20px rgba(0,0,0,0.35);
}
• { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; }
body { font-family: 'Noto Naskh Arabic', serif; background: var(--soft-gray); color: var(--text); min-height: 100vh; transition: all 0.3s ease; }

.header {
background: linear-gradient(135deg, var(--pink), var(--dark-pink));
padding: 14px 16px;
display: flex;
align-items: center;
gap: 12px;
position: sticky; top: 0; z-index: 100;
box-shadow: 0 3px 15px rgba(233,30,140,0.3);
}
.back-btn {
background: rgba(255,255,255,0.2); border: none; border-radius: 10px;
padding: 8px 14px; color: white; font-size: 15px; font-weight: 700;
cursor: pointer;
}
.header-title h1 { font-size: 19px; font-weight: 700; color: white; }
.header-title p { font-size: 12px; opacity: 0.9; color: white; }

.content { padding: 16px; max-width: 520px; margin: 0 auto; }

.stats-bar {
display: flex; justifyContent: space-around; background: var(--card-bg);
border-radius: 16px; padding: 14px; margin-bottom: 16px;
box-shadow: var(--card-shadow);
}
.stat { text-align: center; }
.stat .val { font-size: 19px; font-weight: 900; }
.stat .lbl { font-size: 11px; color: var(--muted); }

.target-char { text-align: center; margin-bottom: 16px; }
.target-char .big {
font-family: 'Noto Sans JP', sans-serif;
font-size: 110px; font-weight: 700;
color: var(--pink); line-height: 1;
}
.target-char .rom { font-size: 18px; color: #c0166e; }
.target-char .ar { font-size: 17px; font-weight: 600; color: var(--text); margin-top: 4px; }

.canvas-wrap {
position: relative; margin: 0 auto 16px;
width: 100%; max-width: 340px;
background: var(--card-bg); border-radius: 20px;
box-shadow: var(--card-shadow);
}
#draw-canvas {
width: 100%; aspect-ratio: 1 / 1;
border-radius: 20px;
background: #fffafd;
border: 3px solid var(--pink);
touch-action: none;
}
body.dark-mode #draw-canvas { background: #241a29; }

.ghost-char {
position: absolute; top: 50%; left: 50%;
transform: translate(-50%, -50%);
font-family: 'Noto Sans JP', sans-serif;
font-size: 160px; font-weight: 700;
color: rgba(233,30,140,0.08);
pointer-events: none;
}

.steps-box {
background: var(--card-bg); border-radius: 16px;
padding: 16px; margin-bottom: 16px;
box-shadow: var(--card-shadow);
}
.steps-title { color: var(--pink); font-weight: 700; margin-bottom: 10px; }
.step-item {
display: flex; gap: 10px; margin-bottom: 8px;
font-size: 14px; line-height: 1.5;
}
.step-num {
width: 22px; height: 22px; border-radius: 50%;
background: var(--pink); color: white;
display: flex; align-items: center; justify-content: center;
font-size: 12px; flex-shrink: 0;
}

.btn-row { display: flex; gap: 12px; margin-top: 8px; }
.btn {
flex: 1; padding: 14px; border: none; border-radius: 14px;
font-weight: 700; font-size: 16px; cursor: pointer;
}
.btn-clear { background: #f8e1eb; color: var(--pink); }
.btn-check { background: var(--pink); color: white; }

.result-box {
margin-top: 12px; padding: 14px; border-radius: 14px;
text-align: center; font-weight: 700; font-size: 16px;
}
.result-box.great { background: #ecfdf5; color: #10b981; border: 2px solid #a7f3d0; }
.result-box.good { background: #fefce8; color: #ca8a04; border: 2px solid #fef08a; }
</style>
</head>
<body>

<div class="header">
<button class="back-btn" onclick="location.href='index.html'">◀ رجوع</button>
<div class="header-title">
<h1>تدريب الكتابة</h1>
<p>ارسمي الحرف بإصبعك ✍️</p>
</div>
<button onclick="toggleTheme()" id="themeBtn">🌙</button>
</div>

<div class="content">
<div class="stats-bar">
<div class="stat"><div class="val">🔥 <span id="streak">3</span></div><div class="lbl">يوم</div></div>
<div class="stat"><div class="val">⭐ <span id="points">245</span></div><div class="lbl">نقاط</div></div>
<div class="stat"><div class="val">🏆 <span id="level">3</span></div><div class="lbl">مستوى</div></div>
</div>

<div class="target-char">
<div class="big" id="target-jp">あ</div>
<div class="rom" id="target-rom">a</div>
<div class="ar" id="target-ar">مثل "أ" في أنا</div>
</div>

<div class="canvas-wrap">
<canvas id="draw-canvas"></canvas>
<div class="ghost-char" id="ghost-char">あ</div>
</div>

<div class="steps-box">
<div class="steps-title">خطوات الكتابة</div>
<div id="steps-list"></div>
</div>

<div class="btn-row">
<button class="btn btn-clear" onclick="clearCanvas()">🗑️ امسحي</button>
<button class="btn btn-check" onclick="checkWriting()">✅ تحققي</button>
</div>

<div class="result-box" id="result-box"></div>

<button class="btn" style="margin-top:12px;background:#10b981;color:white;" onclick="nextChar()">
الحرف التالي →
</button>
</div>

<script>
// بيانات الحروف
const hiragana = [
{jp:"あ",rom:"a",ar:'مثل "أ"',steps:["خط أفقي قصير من الشمال لليمين","خط طويل مايل من فوق لتحت مع انحناءة","خط منحني صغير يعمل حلقة تحت يمين"]},
{jp:"い",rom:"i",ar:'مثل "إي"',steps:["خط رأسي قصير","خط أطول بجانبه"]},
// أضف باقي الحروف هنا...
];

let currentIndex = 0;
let canvas, ctx;

function initCanvas() {
canvas = document.getElementById('draw-canvas');
ctx = canvas.getContext('2d');
resizeCanvas();
}

function resizeCanvas() {
const size = Math.min(340, window.innerWidth - 32);
canvas.width = size;
canvas.height = size;
ctx.lineWidth = 12;
ctx.lineCap = "round";
ctx.lineJoin = "round";
ctx.strokeStyle = "#c0166e";
}

function clearCanvas() {
ctx.clearRect(0, 0, canvas.width, canvas.height);
document.getElementById('result-box').innerHTML = '';
}

function checkWriting() {
const box = document.getElementById('result-box');
box.className = 'result-box great';
box.textContent = '🌸 برافو! رسمتي الحرف بشكل ممتاز!';

setTimeout(() => {
nextChar();
}, 1500);
}

function nextChar() {
currentIndex = (currentIndex + 1) % hiragana.length;
loadCurrentChar();
clearCanvas();
}

function loadCurrentChar() {
const char = hiragana[currentIndex];
document.getElementById('target-jp').textContent = char.jp;
document.getElementById('target-rom').textContent = char.rom;
document.getElementById('target-ar').textContent = char.ar;
document.getElementById('ghost-char').textContent = char.jp;

// خطوات
const list = document.getElementById('steps-list');
list.innerHTML = '';
char.steps.forEach((step, i) => {
const div = document.createElement('div');
div.className = 'step-item';
div.innerHTML = <span class="step-num"&gt;\( {i+1}&lt;/span&gt;&lt;span&gt; \){step}&lt;/span>;
list.appendChild(div);
});
}

function toggleTheme() {
document.body.classList.toggle('dark-mode');
}

// Initialize
window.onload = () => {
initCanvas();
loadCurrentChar();
};
</script>
</body>
</html>
