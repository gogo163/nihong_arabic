<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>تدريب الكتابة – NihongoArabic</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;600;700&family=Noto+Sans+JP:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #e91e8c;
    --light-pink: #fce4f3;
    --dark-pink: #c0166e;
    --white: #ffffff;
    --soft-gray: #f8f0f5;
    --text: #2d1a26;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; }
  body { font-family: 'Noto Naskh Arabic', serif; background: var(--soft-gray); color: var(--text); min-height: 100vh; }

  /* Header */
  .header {
    background: linear-gradient(135deg, var(--pink), var(--dark-pink));
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 3px 15px rgba(233,30,140,0.3);
  }
  .back-btn {
    background: rgba(255,255,255,0.2); border: none; border-radius: 10px;
    padding: 7px 12px; color: white; font-size: 14px; font-weight: 700;
    cursor: pointer; font-family: 'Noto Naskh Arabic', serif; white-space: nowrap;
  }
  .header-title { color: white; }
  .header-title h1 { font-size: 18px; font-weight: 700; }
  .header-title p { font-size: 11px; opacity: 0.85; }

  /* Tab switcher */
  .tabs {
    display: flex; background: white;
    border-bottom: 2px solid var(--light-pink);
  }
  .tab {
    flex: 1; padding: 12px; border: none; background: none;
    font-family: 'Noto Naskh Arabic', serif; font-size: 15px;
    color: #999; cursor: pointer;
    border-bottom: 3px solid transparent; margin-bottom: -2px;
    transition: all 0.2s; font-weight: 700;
  }
  .tab.active { color: var(--pink); border-bottom-color: var(--pink); }

  /* Main content */
  .content { padding: 14px; max-width: 500px; margin: 0 auto; }

  /* Character selector */
  .char-scroll {
    display: flex; gap: 8px; overflow-x: auto;
    padding: 4px 0 10px; -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .char-scroll::-webkit-scrollbar { display: none; }

  .char-chip {
    flex-shrink: 0;
    background: white; border: 2px solid var(--light-pink);
    border-radius: 10px; padding: 8px 10px; cursor: pointer;
    text-align: center; transition: all 0.2s; min-width: 52px;
  }
  .char-chip.active {
    border-color: var(--pink); background: var(--light-pink);
    transform: scale(1.05);
  }
  .char-chip .jp { font-family: 'Noto Sans JP', sans-serif; font-size: 20px; font-weight: 700; color: var(--pink); }
  .char-chip .rom { font-size: 10px; color: #999; }

  /* Practice area */
  .practice-box {
    background: white; border-radius: 20px;
    padding: 18px; margin-bottom: 14px;
    border: 1.5px solid var(--light-pink);
    box-shadow: 0 4px 20px rgba(233,30,140,0.08);
  }

  .target-char {
    text-align: center; margin-bottom: 14px;
  }
  .target-char .big {
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 80px; font-weight: 700;
    color: var(--pink); line-height: 1;
    text-shadow: 0 4px 20px rgba(233,30,140,0.2);
  }
  .target-char .reading { font-size: 16px; color: #888; margin-top: 4px; }
  .target-char .arabic { font-size: 18px; font-weight: 700; color: var(--text); margin-top: 2px; }

  /* Canvas */
  .canvas-wrap {
    position: relative; margin: 0 auto 14px;
    width: 100%; max-width: 320px;
  }

  #draw-canvas {
    width: 100%; aspect-ratio: 1;
    border-radius: 16px;
    border: 2px dashed var(--pink);
    background: #fffafd;
    cursor: crosshair;
    touch-action: none;
    display: block;
  }

  /* Ghost char overlay */
  .ghost-char {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 140px; font-weight: 700;
    color: rgba(233,30,140,0.06);
    pointer-events: none;
    user-select: none;
    line-height: 1;
  }

  /* Stroke order hint */
  .stroke-hint {
    text-align: center; font-size: 12px; color: #b07090; margin-bottom: 12px;
  }

  /* Buttons */
  .btn-row { display: flex; gap: 10px; }
  .btn {
    flex: 1; padding: 13px; border: none; border-radius: 14px;
    font-family: 'Noto Naskh Arabic', serif; font-size: 15px;
    font-weight: 700; cursor: pointer; transition: all 0.2s;
  }
  .btn-clear {
    background: var(--light-pink); color: var(--pink);
    border: 2px solid var(--pink);
  }
  .btn-check {
    background: linear-gradient(135deg, var(--pink), var(--dark-pink));
    color: white; box-shadow: 0 4px 14px rgba(233,30,140,0.3);
  }
  .btn:active { transform: scale(0.97); }

  /* Result */
  .result-box {
    border-radius: 14px; padding: 14px; text-align: center;
    margin-top: 12px; font-size: 16px; font-weight: 700;
    display: none; animation: popIn 0.3s ease;
  }
  .result-box.show { display: block; }
  .result-box.great { background: #f0fdf4; color: #16a34a; border: 2px solid #bbf7d0; }
  .result-box.good { background: #fefce8; color: #ca8a04; border: 2px solid #fef08a; }
  .result-box.try { background: #fef2f2; color: #dc2626; border: 2px solid #fecaca; }

  /* Progress */
  .progress-row {
    display: flex; align-items: center; gap: 10px; margin-bottom: 12px;
  }
  .progress-bar { flex: 1; height: 8px; background: var(--light-pink); border-radius: 4px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(to right, var(--pink), #ff6eb4); border-radius: 4px; transition: width 0.4s; }
  .progress-text { font-size: 12px; color: #b07090; white-space: nowrap; }

  /* Score */
  .score-row {
    display: flex; justify-content: center; gap: 20px;
    margin-bottom: 12px;
  }
  .score-item { text-align: center; }
  .score-num { font-size: 24px; font-weight: 900; }
  .score-label { font-size: 11px; color: #b07090; }
  .score-correct .score-num { color: #16a34a; }
  .score-wrong .score-num { color: #dc2626; }

  /* Next char btn */
  .btn-next {
    width: 100%; padding: 13px; border: none; border-radius: 14px;
    font-family: 'Noto Naskh Arabic', serif; font-size: 16px;
    font-weight: 700; cursor: pointer; margin-top: 10px;
    background: linear-gradient(135deg, var(--pink), var(--dark-pink));
    color: white; box-shadow: 0 4px 14px rgba(233,30,140,0.3);
    display: none;
  }
  .btn-next.show { display: block; }

  @keyframes popIn {
    from { transform: scale(0.8); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .section-label {
    font-size: 13px; color: #b07090; margin-bottom: 8px; font-weight: 700;
  }
</style>
</head>
<body>

<div class="header">
  <button class="back-btn" onclick="location.href='index.html'">◀ رجوع</button>
  <div class="logo" style="font-size:24px;">✍️</div>
  <div class="header-title">
    <h1>تدريب الكتابة</h1>
    <p>ارسمي الحرف بإصبعك</p>
  </div>
</div>

<div class="tabs">
  <button class="tab active" onclick="switchMode('hiragana', this)">ひ هيراغانا</button>
  <button class="tab" onclick="switchMode('katakana', this)">ア كاتاكانا</button>
</div>

<div class="content">

  <!-- Score row -->
  <div class="score-row">
    <div class="score-item score-correct">
      <div class="score-num" id="score-correct">0</div>
      <div class="score-label">✅ صح</div>
    </div>
    <div class="score-item">
      <div class="score-num" style="color:var(--pink);" id="score-total">0</div>
      <div class="score-label">📊 المحاولات</div>
    </div>
    <div class="score-item score-wrong">
      <div class="score-num" id="score-wrong">0</div>
      <div class="score-label">❌ غلط</div>
    </div>
  </div>

  <!-- Progress -->
  <div class="progress-row">
    <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
    <div class="progress-text" id="progress-text">0 / 46</div>
  </div>

  <!-- Char selector -->
  <div class="section-label">اختاري الحرف:</div>
  <div class="char-scroll" id="char-scroll"></div>

  <!-- Practice box -->
  <div class="practice-box">
    <div class="target-char">
      <div class="big" id="target-jp">あ</div>
      <div class="reading" id="target-rom">a</div>
      <div class="arabic" id="target-ar">مثل "أ" في أنا</div>
    </div>

    <div class="canvas-wrap">
      <canvas id="draw-canvas"></canvas>
      <div class="ghost-char" id="ghost-char">あ</div>
    </div>

    <div class="stroke-hint">💡 ارسمي الحرف بإصبعك في الإطار أعلاه</div>

    <div class="btn-row">
      <button class="btn btn-clear" onclick="clearCanvas()">🗑️ امسحي</button>
      <button class="btn btn-check" onclick="checkWriting()">✅ تحققي</button>
    </div>

    <div class="result-box" id="result-box"></div>
    <button class="btn-next" id="btn-next" onclick="nextChar()">الحرف الجاي ←</button>
  </div>

</div>

<script>
// ========================
// DATA
// ========================
const hiragana = [
  {jp:"あ",rom:"a",ar:'مثل "أ"'},
  {jp:"い",rom:"i",ar:'مثل "إي"'},
  {jp:"う",rom:"u",ar:'مثل "أو"'},
  {jp:"え",rom:"e",ar:'مثل "إيه"'},
  {jp:"お",rom:"o",ar:'مثل "أو"'},
  {jp:"か",rom:"ka",ar:"كا"},
  {jp:"き",rom:"ki",ar:"كي"},
  {jp:"く",rom:"ku",ar:"كو"},
  {jp:"け",rom:"ke",ar:"كيه"},
  {jp:"こ",rom:"ko",ar:"كو"},
  {jp:"さ",rom:"sa",ar:"سا"},
  {jp:"し",rom:"shi",ar:"شي"},
  {jp:"す",rom:"su",ar:"سو"},
  {jp:"せ",rom:"se",ar:"سيه"},
  {jp:"そ",rom:"so",ar:"سو"},
  {jp:"た",rom:"ta",ar:"تا"},
  {jp:"ち",rom:"chi",ar:"تشي"},
  {jp:"つ",rom:"tsu",ar:"تسو"},
  {jp:"て",rom:"te",ar:"تيه"},
  {jp:"と",rom:"to",ar:"تو"},
  {jp:"な",rom:"na",ar:"نا"},
  {jp:"に",rom:"ni",ar:"ني"},
  {jp:"ぬ",rom:"nu",ar:"نو"},
  {jp:"ね",rom:"ne",ar:"نيه"},
  {jp:"の",rom:"no",ar:"نو"},
  {jp:"は",rom:"ha",ar:"ها"},
  {jp:"ひ",rom:"hi",ar:"هي"},
  {jp:"ふ",rom:"fu",ar:"فو"},
  {jp:"へ",rom:"he",ar:"هيه"},
  {jp:"ほ",rom:"ho",ar:"هو"},
  {jp:"ま",rom:"ma",ar:"ما"},
  {jp:"み",rom:"mi",ar:"مي"},
  {jp:"む",rom:"mu",ar:"مو"},
  {jp:"め",rom:"me",ar:"ميه"},
  {jp:"も",rom:"mo",ar:"مو"},
  {jp:"や",rom:"ya",ar:"يا"},
  {jp:"ゆ",rom:"yu",ar:"يو"},
  {jp:"よ",rom:"yo",ar:"يو"},
  {jp:"ら",rom:"ra",ar:"را"},
  {jp:"り",rom:"ri",ar:"ري"},
  {jp:"る",rom:"ru",ar:"رو"},
  {jp:"れ",rom:"re",ar:"ريه"},
  {jp:"ろ",rom:"ro",ar:"رو"},
  {jp:"わ",rom:"wa",ar:"وا"},
  {jp:"を",rom:"wo",ar:"ووه"},
  {jp:"ん",rom:"n",ar:"ن"},
];

const katakana = [
  {jp:"ア",rom:"a",ar:'مثل "أ"'},
  {jp:"イ",rom:"i",ar:'مثل "إي"'},
  {jp:"ウ",rom:"u",ar:'مثل "أو"'},
  {jp:"エ",rom:"e",ar:'مثل "إيه"'},
  {jp:"オ",rom:"o",ar:'مثل "أو"'},
  {jp:"カ",rom:"ka",ar:"كا"},
  {jp:"キ",rom:"ki",ar:"كي"},
  {jp:"ク",rom:"ku",ar:"كو"},
  {jp:"ケ",rom:"ke",ar:"كيه"},
  {jp:"コ",rom:"ko",ar:"كو"},
  {jp:"サ",rom:"sa",ar:"سا"},
  {jp:"シ",rom:"shi",ar:"شي"},
  {jp:"ス",rom:"su",ar:"سو"},
  {jp:"セ",rom:"se",ar:"سيه"},
  {jp:"ソ",rom:"so",ar:"سو"},
  {jp:"タ",rom:"ta",ar:"تا"},
  {jp:"チ",rom:"chi",ar:"تشي"},
  {jp:"ツ",rom:"tsu",ar:"تسو"},
  {jp:"テ",rom:"te",ar:"تيه"},
  {jp:"ト",rom:"to",ar:"تو"},
  {jp:"ナ",rom:"na",ar:"نا"},
  {jp:"ニ",rom:"ni",ar:"ني"},
  {jp:"ヌ",rom:"nu",ar:"نو"},
  {jp:"ネ",rom:"ne",ar:"نيه"},
  {jp:"ノ",rom:"no",ar:"نو"},
  {jp:"ハ",rom:"ha",ar:"ها"},
  {jp:"ヒ",rom:"hi",ar:"هي"},
  {jp:"フ",rom:"fu",ar:"فو"},
  {jp:"ヘ",rom:"he",ar:"هيه"},
  {jp:"ホ",rom:"ho",ar:"هو"},
  {jp:"マ",rom:"ma",ar:"ما"},
  {jp:"ミ",rom:"mi",ar:"مي"},
  {jp:"ム",rom:"mu",ar:"مو"},
  {jp:"メ",rom:"me",ar:"ميه"},
  {jp:"モ",rom:"mo",ar:"مو"},
  {jp:"ヤ",rom:"ya",ar:"يا"},
  {jp:"ユ",rom:"yu",ar:"يو"},
  {jp:"ヨ",rom:"yo",ar:"يو"},
  {jp:"ラ",rom:"ra",ar:"را"},
  {jp:"リ",rom:"ri",ar:"ري"},
  {jp:"ル",rom:"ru",ar:"رو"},
  {jp:"レ",rom:"re",ar:"ريه"},
  {jp:"ロ",rom:"ro",ar:"رو"},
  {jp:"ワ",rom:"wa",ar:"وا"},
  {jp:"ヲ",rom:"wo",ar:"ووه"},
  {jp:"ン",rom:"n",ar:"ن"},
];

// ========================
// STATE
// ========================
let currentMode = 'hiragana';
let currentData = hiragana;
let currentIndex = 0;
let scoreCorrect = 0;
let scoreWrong = 0;
let scoreTotal = 0;
let mastered = new Set();
let isDrawing = false;
let lastX = 0, lastY = 0;
let hasDrawn = false;

// Canvas setup
const canvas = document.getElementById('draw-canvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  const size = canvas.offsetWidth;
  canvas.width = size;
  canvas.height = size;
  setupCtx();
}

function setupCtx() {
  ctx.strokeStyle = '#c0166e';
  ctx.lineWidth = Math.max(8, canvas.width * 0.03);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
}

window.addEventListener('resize', resizeCanvas);
setTimeout(resizeCanvas, 100);

// ========================
// DRAW EVENTS
// ========================
function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  if (e.touches) {
    return {
      x: (e.touches[0].clientX - rect.left) * scaleX,
      y: (e.touches[0].clientY - rect.top) * scaleY
    };
  }
  return {
    x: (e.clientX - rect.left) * scaleX,
    y: (e.clientY - rect.top) * scaleY
  };
}

canvas.addEventListener('mousedown', e => { isDrawing = true; hasDrawn = true; const p = getPos(e); lastX = p.x; lastY = p.y; });
canvas.addEventListener('mousemove', e => { if (!isDrawing) return; draw(e); });
canvas.addEventListener('mouseup', () => isDrawing = false);
canvas.addEventListener('mouseleave', () => isDrawing = false);

canvas.addEventListener('touchstart', e => {
  e.preventDefault(); isDrawing = true; hasDrawn = true;
  const p = getPos(e); lastX = p.x; lastY = p.y;
}, {passive: false});
canvas.addEventListener('touchmove', e => {
  e.preventDefault(); if (!isDrawing) return; draw(e);
}, {passive: false});
canvas.addEventListener('touchend', () => isDrawing = false);

function draw(e) {
  const p = getPos(e);
  ctx.beginPath();
  ctx.moveTo(lastX, lastY);
  ctx.lineTo(p.x, p.y);
  ctx.stroke();
  lastX = p.x; lastY = p.y;
}

// ========================
// CLEAR
// ========================
function clearCanvas() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  hasDrawn = false;
  document.getElementById('result-box').className = 'result-box';
  document.getElementById('btn-next').className = 'btn-next';
}

// ========================
// CHECK WRITING
// ========================
function checkWriting() {
  if (!hasDrawn) {
    showResult('try', '✏️ ارسمي الحرف الأول!');
    return;
  }

  // Check if canvas has meaningful strokes
  const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  let filledPixels = 0;
  for (let i = 3; i < imageData.data.length; i += 4) {
    if (imageData.data[i] > 50) filledPixels++;
  }

  const fillRatio = filledPixels / (canvas.width * canvas.height);
  scoreTotal++;
  document.getElementById('score-total').textContent = scoreTotal;

  if (fillRatio < 0.005) {
    showResult('try', '✏️ ارسمي أكتر! الخط خفيف جداً.');
    return;
  }

  // Good drawing - give positive feedback based on coverage
  if (fillRatio > 0.005 && fillRatio < 0.5) {
    scoreCorrect++;
    mastered.add(currentIndex);
    document.getElementById('score-correct').textContent = scoreCorrect;
    updateProgress();

    const msgs = [
      '🌸 ممتاز! الرسم كويس جداً!',
      '✨ برافو! استمري!',
      '🎌 رائع! أنتِ بتتعلمي بسرعة!',
      '💪 أحسنتِ! الحرف واضح!',
      '🌟 جميل جداً! كملي!',
    ];
    showResult('great', msgs[Math.floor(Math.random() * msgs.length)]);
  } else if (fillRatio >= 0.5) {
    scoreWrong++;
    document.getElementById('score-wrong').textContent = scoreWrong;
    showResult('good', '👀 كتير شوية! حاولي ترسمي الحرف بدقة أكتر.');
  }

  document.getElementById('btn-next').className = 'btn-next show';
}

function showResult(type, msg) {
  const box = document.getElementById('result-box');
  box.className = `result-box ${type} show`;
  box.textContent = msg;
}

// ========================
// NAVIGATION
// ========================
function nextChar() {
  currentIndex = (currentIndex + 1) % currentData.length;
  loadChar(currentIndex);
  clearCanvas();
  // Update chip selection
  document.querySelectorAll('.char-chip').forEach((c, i) => {
    c.classList.toggle('active', i === currentIndex);
  });
  // Scroll chip into view
  const chips = document.querySelectorAll('.char-chip');
  if (chips[currentIndex]) chips[currentIndex].scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
}

function loadChar(index) {
  const char = currentData[index];
  document.getElementById('target-jp').textContent = char.jp;
  document.getElementById('target-rom').textContent = char.rom;
  document.getElementById('target-ar').textContent = char.ar;
  document.getElementById('ghost-char').textContent = char.jp;
}

function updateProgress() {
  const pct = Math.round(mastered.size / currentData.length * 100);
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = `${mastered.size} / ${currentData.length}`;
}

// ========================
// CHAR CHIPS
// ========================
function buildChips() {
  const scroll = document.getElementById('char-scroll');
  scroll.innerHTML = '';
  currentData.forEach((char, i) => {
    const chip = document.createElement('div');
    chip.className = 'char-chip' + (i === currentIndex ? ' active' : '');
    chip.innerHTML = `<div class="jp">${char.jp}</div><div class="rom">${char.rom}</div>`;
    chip.onclick = () => {
      currentIndex = i;
      loadChar(i);
      clearCanvas();
      document.querySelectorAll('.char-chip').forEach((c,j) => c.classList.toggle('active', j===i));
    };
    scroll.appendChild(chip);
  });
}

// ========================
// MODE SWITCH
// ========================
function switchMode(mode, btn) {
  currentMode = mode;
  currentData = mode === 'hiragana' ? hiragana : katakana;
  currentIndex = 0;
  mastered.clear();
  scoreCorrect = 0; scoreWrong = 0; scoreTotal = 0;
  document.getElementById('score-correct').textContent = 0;
  document.getElementById('score-wrong').textContent = 0;
  document.getElementById('score-total').textContent = 0;
  updateProgress();
  buildChips();
  loadChar(0);
  clearCanvas();
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
}

// ========================
// INIT
// ========================
buildChips();
loadChar(0);
</script>
</body>
</html>
