const params = new URLSearchParams(window.location.search);
const lessonId = parseInt(params.get("id")) || 1;
let completed = [];
try { completed = JSON.parse(localStorage.getItem("completedLessons") || "[]"); } catch(e){}

const lesson = lessons.find(l => l.id === lessonId);

if (!lesson) {
  document.getElementById("content").innerHTML = "<div class=\"error\">❌ الدرس مش موجود</div>";
} else {
  const nextLesson = lessons.find(x => x.id === lessonId + 1);
  const isDone = completed.includes(lessonId);

  document.title = "درس " + lesson.id + " - " + lesson.title;
  document.getElementById("header-title").textContent = lesson.title;
  document.getElementById("header-badge").textContent = "درس " + lesson.id;

  let html = "";

  html += `<div class="title-card">

    </tbody></table></div>`;

function toggleDone(id) {
  const btn = document.getElementById("done-btn");
  if (completed.includes(id)) {
    completed = completed.filter(x => x !== id);
    btn.textContent = "☑️ خلصت الدرس";
    btn.classList.remove("done-state");
  } else {
    completed.push(id);
    btn.textContent = "✅ تم الدرس";
    btn.classList.add("done-state");
  }
  try { localStorage.setItem("completedLessons", JSON.stringify(completed)); } catch(e){}
}

function speak(text) {
  if ("speechSynthesis" in window) {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "ja-JP";
    speechSynthesis.speak(u);
  }
}
</script>
