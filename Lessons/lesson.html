 なんですか？", "meaning": "إيه هدفك؟"}, {"pattern": "ゆめを あきらめないで！", "meaning": "متتخليش عن حلمك!"}], "dialogue": [{"speaker": "يوكو", "japanese": "にほんごが じょうずに なりましたね！", "romaji": "Nihongo ga jouzu ni narimashita ne!", "arabic": "ياباني بتاعك اتحسن!"}, {"speaker": "أحمد", "japanese": "ありがとうございます！まだまだ べんきょうします。", "romaji": "Arigatou gozaimasu! Mada mada benkyou shimasu.", "arabic": "شكراً! هكمل أذاكر."}, {"speaker": "يوكو", "japanese": "もくひょうは なんですか？", "romaji": "Mokuhyou wa nan desu ka?", "arabic": "إيه هدفك؟"}, {"speaker": "أحمد", "japanese": "にほんで はたらきたいです！ゆめを あきらめません！", "romaji": "Nihon de hatarakitai desu! Yume wo akiramemasen!", "arabic": "عايز أشتغل في اليابان! مش هتخلى عن حلمي!"}], "exercises": ["ياباني بتاعي اتحسن → にほんごが じょうずに _____", "هكمل أذاكر → べんきょうを _____", "إيه هدفك؟ → _____は なんですか？"]}, {"id": 51, "title": "مجموعات الأفعال", "japanese": "どうしの グループ", "romaji": "doushi no guruupu", "vocabulary": [{"arabic": "يكتب (مجموعة 1)", "romaji": "kaku", "japanese": "かく"}, {"arabic": "يشرب (مجموعة 1)", "romaji": "nomu", "japanese": "のむ"}, {"arabic": "يروح (مجموعة 1)", "romaji": "iku", "japanese": "いく"}, {"arabic": "يتكلم (مجموعة 1)", "romaji": "hanasu", "japanese": "はなす"}, {"arabic": "ياكل (مجموعة 2)", "romaji": "taberu", "japanese": "たべる"}, {"arabic": "يشوف (مجموعة 2)", "romaji": "miru", "japanese": "みる"}, {"arabic": "يصحى (مجموعة 2)", "romaji": "okiru", "japanese": "おきる"}, {"arabic": "يعمل (مجموعة 3)", "romaji": "suru", "japanese": "する"}, {"arabic": "ييجي (مجموعة 3)", "romaji": "kuru", "japanese": "くる"}], "grammar": [{"pattern": "الصيغة العادية (辞書形) ↔ صيغة ます", "meaning": "かきます ↔ かく ، たべます ↔ たべる ، します ↔ する ، きます ↔ くる. الصيغة العادية هي اللي في القاموس وهي أساس كل التصريفات"}, {"pattern": "مجموعة 1: آخر حرف في الصيغة العادية من صف う (う く ぐ す つ ぬ ぶ む る)", "meaning": "かく ، のむ ، いく ، はなす ، かう ، まつ ، あそぶ ، およぐ"}, {"pattern": "مجموعة 2: تنتهي بـ る وقبلها صوت い أو え", "meaning": "たべる (べ = え) ، みる (み = い) ، おきる (き = い) ، ねる (ね = え)"}, {"pattern": "مجموعة 3 (شاذّة): فعلين بس وعة 1: む / ぶ / ぬ → んで", "meaning": "のむ → のんで ، あそぶ → あそんで ، しぬ → しんで"}, {"pattern": "مجموعة 1: く → いて / ぐ → いで", "meaning": "かく → かいて ، およぐ → およいで"}, {"pattern": "مجموعة 1: す → して", "meaning": "はなす → はなして ، かす → かして"}, {"pattern": "استثناء ومجموعة 3", "meaning": "いく → いって (مش いいて!) ، する → して ، くる → きて"}, {"pattern": "الاستخدام: 〜て ください / 〜ても いいです", "meaning": "かいて ください (اكتب من فضلك) ، まって ください (استنى من فضلك) ، たべても いいです (ينفع تاكل)"}], "dialogue": [{"speaker": "يوكو", "japanese": "ここに なまえを かいて ください。", "romaji": "Koko ni namae o kaite kudasai.", "arabic": "اكتب اسمك هنا من فضلك."}, {"speaker": "أحمد", "japanese": "はい。ペンを かして ください。", "romaji": "Hai. Pen o kashite kudasai.", "arabic": "حاضر. أسلفني القلم من فضلك."}, {"speaker": "يوكو", "japanese": "どうぞ。", "romaji": "Douzo.", "arabic": "اتفضل."}, {"speaker": "أحمد", "japanese": "ありがとう ございます。すこし まって ください。", "romaji": "Arigatou gozaimasu. Sukoshi matte kudasai.", "arabic": "شكراً. استنى شوية من فضلك."}], "exercises": ["حوّل لصيغة て: のむ / かく / たべる / いく / あそぶ", "حوّل: はなす → _____ / およぐ → _____ / する → _____", "ترجم: استنى من فضلك → _____ ください。"]}, {"id": 53, "title": "صيغة ない (النفي العادي)", "japanese": "ない けい", "romaji": "nai-kei", "vocabulary": [{"arabic": "ما بيكتبش (かく)", "romaji": "kakanai", "japanese": "かかない"}, {"arabic": "ما بيشربش (のむ)", "romaji": "nomanai", "japanese": "のまない"}, {"arabic": "ما بيروحش (いく)", "romaji": "ikanai", "japanese": "いかない"}, {"arabic": "ما بيشتريش (かう)", "romaji": "kawanai", "japanese": "かわない"}, {"arabic": "ما بياكلش (たべる)", "romaji": "tabenai", "japanese": "たべない"}, {"arabic": "ما بيشوفش (みる)", "romaji": "minai", "japanese": "みない"}, {"arabic": "ما بيعملش (する)", "romaji": "shinai", "japanese": "しない"}, {"arabic": "ما بييجيش (くる)", "romaji": "konai", "japanese": "こない"}, {"arabic": "مش موجود (ある)", "romaji": "nai", "japanese": "ない"}], "grammar": [{"pattern": "مجموعة 2: احذف る وزوّد ない", "meaning": "たべる → たべない ، みる → みない ، おきる → おきない"}, {"pattern": "مجموعة 1: غيّر آخر حرف لصف あ وزوّد ない", "meanin // دروس التأسيس (51-59: الأفعال، ている، الحروف، العدّادات، المقارنة، الأدوات الزمنية): مسار منفصل، مفتوح دايماً، وتقدّمه محفوظ لوحده

(function guardLockedLesson() {
  if (IS_VERBS) {
    const seqOk = lessonId === VERBS_FIRST_ID || completed.includes(lessonId) || completed.includes(lessonId - 1);

  }
  function nextUnlockedId() {
    for (let i = 1; i <= 25; i++) {
      if (!completed.includes(i)) return i;
    }
    return 25;
  }

  if (!isUnlocked) {
    window.location.href = "index.html";

  const verbsEnd = IS_VERBS && !nextLesson; // آخر درس تأسيس أفعال
  const isDone = completed.includes(lessonId);

  document.title = "درس " + lesson.id + " - " + lesson.title;
  document.getElementById("header-title").textContent = lesson.title;
  document.getElementById("header-badge").textContent = IS_VERBS ? ("تأسيس " + (lessonId - VERBS_FIRST_ID + 1) + "/" + (VERBS_LAST_ID - VERBS_FIRST_ID + 1)) : ("درس " + lesson.id);

  let html = "";

  html += `<div class="title-card">
    <div class="jp-big">${lesson.japanese}</div>
    <div class="rom">${lesson.romaji}</div>
    <div class="ar-title">${lesson.title}</div>
  </div>`;

  html += `<div class="card"><div class="card-title">📚 المفردات</div>
    <table><thead><tr><th>العربي</th><th>Romaji</th><th>الياباني</th><th>🔊</th></tr></thead><tbody>
    ${lesson.vocabulary.map(v => `<tr>
      <td>${v.arabic}</td>
      <td>${v.romaji}</td>
      <td class="jp-cell">${v.japanese}</td>
      <td><button class="tts" onclick="speak('${v.japanese.replace(/'/g,"\'")}')">🔊</button></td>
    </tr>`).join("")}
    </tbody></table></div>`;

  html += `<div class="card"><div class="card-title">📖 القاعدة النحوية</div>
    ${lesson.grammar.map(g => `<div class="grammar-box">
      <div class="pat">${g.pattern}</div>
      <div class="mng">${g.meaning}</div>
    </div>`).join("")}</div>`;

  html += `<div class="card"><div class="card-title">💬 الحوار</div>
    ${lesson.dialogue.map(d => `<div class="dlg-line">
      <div class="spk">${d.speaker}</div>
      <div class="speech">
        <div class="jp">${d.japanese} <button class="tts" onclick="speak('${d.japanese.replace(/'/g,"\'")}')">🔊</button></div>
        <div class="rm">${d.romaji}</div>
        <div class="ar">${d.arabic}</div>
      </div>
    </div>`).join("")}</div>`;

  html += `<div class="card"><div class="card-title">✏️ تمارين</div>
    ${lesson.exercises.map((ex,i) => `<div class="ex-item">
      <div class="ex-num">${i+1}</div>
      <div>${ex}</div>
    </div>`).join("")}</div>`;

  html += `<div class="bottom-btns">
    <button class="btn-done ${isDone ? "done-state" : ""}" id="done-btn" onclick="toggleDone(${lesson.id})">
      ${isDone ? "✅ تم الدرس" : "☑️ خلصت الدرس"}
    </button>
    <button class="btn-next"
      onclick="${verbsEnd ? "window.location.href='index.html'" : `localStorage.setItem('selectedLessonId', ${lesson.id + 1}); window.location.href='lesson.html'`}"
      ${(!nextLesson && !verbsEnd) ? "disabled" : ""}>
      ${nextLesson ? "التالي: " + nextLesson.title + " ←" : (verbsEnd ? "🎉 خلصت دروس التأسيس — ارجع للدروس ←" : "🎉 آخر درس!")}
    </button>
  </div>`;

  document.getElementById("content").innerHTML = html;
}

function toggleDone(id) {
  const btn = document.getElementById("done-btn");
  if (completed.includes(id)) {
    completed = completed.filter(x => x !== id);
    btn.textContent = "☑️ خلصت الدرس";
    btn.classList.remove("done-state");
  } else {
    completed.push(id);
    btn.textContent = "✅ تم الدرس";
    btn.classList.add("done-state");
    awardLessonPoints(id);
  }
  try { localStorage.setItem(COMPLETED_KEY, JSON.stringify(completed)); } catch(e){}
}

/* ==================== الوضع الليلي (مشترك مع باقي صفحات التطبيق) ==================== */
function loadTheme() {
  return localStorage.getItem('nihongo_theme') === 'dark' ? 'dark' : 'light';
}
function applyTheme() {
  const mode = loadTheme();
  document.body.classList.toggle('dark-mode', mode === 'dark');
  const btn = document.getElementById('themeToggleBtn');
  if (btn) btn.textContent = mode === 'dark' ? '☀️' : '🌙';
}
function toggleTheme() {
  const next = loadTheme() === 'dark' ? 'light' : 'dark';
  localStorage.setItem('nihongo_theme', next);
  applyTheme();
}

/* ==================== Streak / نقاط / مستوى (مشترك مع باقي صفحات التطبيق) ==================== */
const POINTS_PER_NEW_LESSON = 10;
const POINTS_PER_LEVEL = 50;

function loadVisited() {
  try { return JSON.parse(localStorage.getItem('nihongo_visited') || '[]'); }
  catch(e) { return []; }
}
function saveVisited(arr) {
  localStorage.setItem('nihongo_visited', JSON.stringify(arr));
}
function loadPoints() {
  return parseInt(localStorage.getItem('nihongo_points') || '0', 10);
}
function savePoints(p) {
  localStorage.setItem('nihongo_points', String(p));
}
function getLevel(points) {
  return Math.floor(points / POINTS_PER_LEVEL) + 1;
}
function updateStreakOnLoad() {
  const today = new Date().toDateString();
  const lastVisit = localStorage.getItem('nihongo_last_visit');
  let streak = parseInt(localStorage.getItem('nihongo_streak') || '0', 10);

  if (lastVisit === today) return streak || 1;

  const yesterday = new Date();
  yesterday.setDate(yesterday.getDate() - 1);

  if (lastVisit === yesterday.toDateString()) streak += 1;
  else streak = 1;

  localStorage.setItem('nihongo_streak', String(streak));
  localStorage.setItem('nihongo_last_visit', today);
  return streak;
}
function renderStats() {
  document.getElementById('streakVal').textContent = localStorage.getItem('nihongo_streak') || '0';
  document.getElementById('pointsVal').textContent = loadPoints();
  document.getElementById('levelVal').textContent = getLevel(loadPoints());
}
function awardLessonPoints(id) {
  const key = 'lesson25_' + id;
  const visited = loadVisited();
  if (!visited.includes(key)) {
    visited.push(key);
    saveVisited(visited);
    savePoints(loadPoints() + POINTS_PER_NEW_LESSON);
    renderStats();
  }
}

// تشغيل عند فتح الصفحة
applyTheme();
updateStreakOnLoad();
renderStats();

function speak(text) {
  // طريقة 0 (جديدة): ملف صوت مسجّل مسبقًا
  const audioPath = AUDIO_MAP[text];
  if (audioPath) {
    const audio = new Audio(audioPath);
    audio.onerror = () => fallbackSpeak(text);
    audio.play().catch(() => fallbackSpeak(text));
    return;
  }
  fallbackSpeak(text);
}

function fallbackSpeak(text) {
  // Try Android interface first (MIT App Inventor bridge)
  if (window.AppInventor) {
    try { window.AppInventor.setWebViewString(text); return; } catch(e){}
  }
  // Try speechSynthesis
  if ("speechSynthesis" in window) {
    window.speechSynthesis.cancel();
    // Wait for voices to load
    const trySpeak = () => {
      const voices = speechSynthesis.getVoices();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "ja-JP";
      u.rate = 0.9;
      // Try to find Japanese voice
      const jpVoice = voices.find(v => v.lang.startsWith("ja"));
      if (jpVoice) u.voice = jpVoice;
      speechSynthesis.speak(u);
    };
    if (speechSynthesis.getVoices().length > 0) {
      trySpeak();
    } else {
      speechSynthesis.addEventListener("voiceschanged", trySpeak, {once: true});
      setTimeout(trySpeak, 1000); // fallback
    }
  }
}
