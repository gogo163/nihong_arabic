<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NihongoArabic – درس</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: #fff0f5;
      color: #2d2d2d;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #e91e8c, #ff6eb4);
      color: white;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 2px 8px rgba(233,30,140,0.3);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    header .back {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      width: 36px; height: 36px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    header h1 { font-size: 16px; flex: 1; }
    header .badge {
      background: rgba(255,255,255,0.25);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      flex-shrink: 0;
    }

    .content { padding: 14px; max-width: 640px; margin: 0 auto; }

    /* TITLE CARD */
    .title-card {
      background: linear-gradient(135deg, #e91e8c, #ff6eb4);
      color: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 14px;
      text-align: center;
    }
    .title-card .jp-big { font-size: 30px; letter-spacing: 3px; margin-bottom: 6px; }
    .title-card .rom { font-size: 13px; opacity: 0.85; margin-bottom: 6px; }
    .title-card .ar-title { font-size: 18px; font-weight: bold; }

    /* CARD */
    .card {
      background: white;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(233,30,140,0.07);
    }
    .card-title {
      font-size: 14px;
      font-weight: bold;
      color: #e91e8c;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* VOCAB TABLE */
    table { width: 100%; border-collapse: collapse; }
    th {
      background: #fff0f5;
      color: #e91e8c;
      padding: 8px 6px;
      font-size: 12px;
      text-align: center;
      border-bottom: 2px solid #ffd6e8;
    }
    td {
      padding: 9px 6px;
      text-align: center;
      font-size: 13px;
      border-bottom: 1px solid #ffeef5;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #fff8fb; }
    .jp-cell { font-size: 17px; color: #c2185b; }

    /* TTS */
    .tts {
      background: none;
      border: none;
      color: #e91e8c;
      font-size: 16px;
      cursor: pointer;
      padding: 2px 5px;
      border-radius: 6px;
    }
    .tts:hover { background: #ffd6e8; }

    /* GRAMMAR */
    .grammar-box {
      background: #fff0f5;
      border-right: 4px solid #e91e8c;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 10px;
    }
    .grammar-box .pat {
      font-size: 16px;
      color: #c2185b;
      margin-bottom: 3px;
      direction: ltr;
      text-align: left;
    }
    .grammar-box .mng { font-size: 13px; color: #555; }

    /* DIALOGUE */
    .dlg-line {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      align-items: flex-start;
    }
    .spk {
      background: #e91e8c;
      color: white;
      border-radius: 16px;
      padding: 3px 10px;
      font-size: 11px;
      white-space: nowrap;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .speech { flex: 1; }
    .speech .jp { font-size: 15px; color: #c2185b; margin-bottom: 2px; }
    .speech .rm { font-size: 11px; color: #aaa; margin-bottom: 2px; direction: ltr; text-align: left; }
    .speech .ar { font-size: 13px; color: #666; }

    /* EXERCISES */
    .ex-item {
      background: #fff0f5;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 8px;
      font-size: 13px;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .ex-num {
      background: #e91e8c;
      color: white;
      width: 24px; height: 24px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px;
      flex-shrink: 0;
    }

    /* BOTTOM BUTTONS */
    .bottom-btns {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
      margin-top: 4px;
    }
    .btn-done {
      flex: 1;
      background: linear-gradient(135deg, #e91e8c, #ff6eb4);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 14px;
      font-size: 15px;
      cursor: pointer;
      font-family: inherit;
      transition: opacity 0.2s;
    }
    .btn-done:hover { opacity: 0.9; }
    .btn-done.done-state {
      background: linear-gradient(135deg, #4caf50, #66bb6a);
    }
    .btn-next {
      flex: 1;
      background: white;
      color: #e91e8c;
      border: 2px solid #e91e8c;
      padding: 14px;
      border-radius: 14px;
      font-size: 15px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
    }
    .btn-next:hover { background: #e91e8c; color: white; }
    .btn-next:disabled { opacity: 0.3; cursor: not-allowed; }

    .loading { text-align: center; padding: 40px; color: #e91e8c; font-size: 18px; }
  </style>
</head>
<body>

<header>
  <button class="back" onclick="window.location.href='index.html'">→</button>
  <h1 id="header-title">جاري التحميل...</h1>
  <div class="badge" id="header-badge">درس -</div>
</header>

<div class="content" id="content">
  <div class="loading">⏳ جاري التحميل...</div>
</div>

<script>
  // Get lesson ID from URL
  const params = new URLSearchParams(window.location.search);
  const lessonId = parseInt(params.get('id')) || 1;
  let lessons = [];
  let completed = JSON.parse(localStorage.getItem('completedLessons') || '[]');

  async function loadLesson() {
    try {
      const res = await fetch('lessons.json');
      lessons = await res.json();
      const lesson = lessons.find(l => l.id === lessonId);
      if (!lesson) {
        document.getElementById('content').innerHTML = '<div class="loading">❌ الدرس مش موجود</div>';
        return;
      }
      renderLesson(lesson);
    } catch(e) {
      document.getElementById('content').innerHTML = '<div class="loading">❌ تعذر تحميل الدرس</div>';
    }
  }

  function renderLesson(l) {
    document.title = `درس ${l.id} – ${l.title}`;
    document.getElementById('header-title').textContent = l.title;
    document.getElementById('header-badge').textContent = `درس ${l.id}`;

    const isDone = completed.includes(l.id);
    const nextLesson = lessons.find(x => x.id === l.id + 1);

    let html = '';

    // Title card
    html += `
      <div class="title-card">
        <div class="jp-big">${l.japanese}</div>
        <div class="rom">${l.romaji}</div>
        <div class="ar-title">${l.title}</div>
      </div>`;

    // Vocabulary
    html += `
      <div class="card">
        <div class="card-title">📚 المفردات</div>
        <table>
          <thead><tr>
            <th>العربي</th><th>Romaji</th><th>الياباني</th><th>🔊</th>
          </tr></thead>
          <tbody>
            ${l.vocabulary.map(v => `
              <tr>
                <td>${v.arabic}</td>
                <td>${v.romaji}</td>
                <td class="jp-cell">${v.japanese}</td>
                <td><button class="tts" onclick="speak('${v.japanese.replace(/'/g,"\\'")}')">🔊</button></td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>`;

    // Grammar
    html += `<div class="card"><div class="card-title">📖 القاعدة النحوية</div>`;
    l.grammar.forEach(g => {
      html += `
        <div class="grammar-box">
          <div class="pat">${g.pattern}</div>
          <div class="mng">${g.meaning}</div>
        </div>`;
    });
    html += `</div>`;

    // Dialogue
    html += `<div class="card"><div class="card-title">💬 الحوار</div>`;
    l.dialogue.forEach(d => {
      html += `
        <div class="dlg-line">
          <div class="spk">${d.speaker}</div>
          <div class="speech">
            <div class="jp">${d.japanese}
              <button class="tts" onclick="speak('${d.japanese.replace(/'/g,"\\'")}')">🔊</button>
            </div>
            <div class="rm">${d.romaji}</div>
            <div class="ar">${d.arabic}</div>
          </div>
        </div>`;
    });
    html += `</div>`;

    // Exercises
    html += `<div class="card"><div class="card-title">✏️ تمارين</div>`;
    l.exercises.forEach((ex, i) => {
      html += `
        <div class="ex-item">
          <div class="ex-num">${i+1}</div>
          <div>${ex}</div>
        </div>`;
    });
    html += `</div>`;

    // Bottom buttons
    html += `
      <div class="bottom-btns">
        <button class="btn-done ${isDone ? 'done-state' : ''}"
                id="done-btn"
                onclick="toggleDone(${l.id})">
          ${isDone ? '✅ تم الدرس' : '☑️ خلصت الدرس'}
        </button>
        <button class="btn-next"
                onclick="window.location.href='Lesson.html?id=${l.id + 1}'"
                ${!nextLesson ? 'disabled' : ''}>
          ${nextLesson ? `التالي: ${nextLesson.title} ←` : '🎉 آخر درس!'}
        </button>
      </div>`;

    document.getElementById('content').innerHTML = html;
  }

  function toggleDone(id) {
    const btn = document.getElementById('done-btn');
    if (completed.includes(id)) {
      completed = completed.filter(x => x !== id);
      btn.textContent = '☑️ خلصت الدرس';
      btn.classList.remove('done-state');
    } else {
      completed.push(id);
      btn.textContent = '✅ تم الدرس';
      btn.classList.add('done-state');
    }
    localStorage.setItem('completedLessons', JSON.stringify(completed));
  }

  function speak(text) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'ja-JP';
      speechSynthesis.speak(u);
    }
  }

  loadLesson();
</script>
</body>
</html>
